{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#162a3a">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
{% if page.url == "/" %}
<link rel="preload" as="image" href="{{ base_path }}/images/james-onyejizu-headshot.jpg" type="image/jpeg" fetchpriority="high">
{% endif %}
{% if page.layout == "demo" %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/occupancy-demo.css"/>
{% endif %}

<!-- end custom head snippets -->
